<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="55%" stop-color="#10102b"/>
      <stop offset="100%" stop-color="#170b22"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ffcff"/>
      <stop offset="50%" stop-color="#8b5cff"/>
      <stop offset="100%" stop-color="#ff4fc8"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ffcff"/>
      <stop offset="100%" stop-color="#8b5cff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>

    <pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity=".025"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="584" rx="12" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="584" rx="12" fill="url(#scan)"/>

  <!-- Ambient glow -->
  <circle cx="930" cy="310" r="210" fill="#6f4cff" opacity=".08"/>
  <circle cx="930" cy="310" r="135" fill="#4ffcff" opacity=".06"/>

  <!-- Outer frame -->
  <rect x="18" y="18" width="1164" height="584" rx="12"
        fill="none" stroke="url(#line)" stroke-width="2"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#4ffcff" stroke-width="3">
    <path d="M45 90V45H90"/>
    <path d="M1110 45H1155V90"/>
    <path d="M45 530V575H90"/>
    <path d="M1110 575H1155V530"/>
  </g>

  <!-- Header -->
  <text x="62" y="73" fill="#4ffcff" font-family="monospace" font-size="15" letter-spacing="3">
    SYSTEM PROFILE // USER NODE
  </text>

  <text x="62" y="124" fill="#ffffff" font-family="monospace" font-size="38" font-weight="700">
    MEDLYN.JACOB<tspan fill="#8b5cff">.exe</tspan>
  </text>

  <text x="63" y="153" fill="#aeb6d6" font-family="monospace" font-size="15" letter-spacing="2">
    SOFTWARE ENGINEER  /  AI  /  BACKEND  /  SYSTEMS
  </text>

  <!-- Status -->
  <g transform="translate(1000 62)">
    <circle cx="0" cy="-5" r="6" fill="#4ffcff" filter="url(#glow)"/>
    <text x="16" y="0" fill="#4ffcff" font-family="monospace" font-size="14">ACTIVE</text>
  </g>

  <!-- Divider -->
  <line x1="62" y1="178" x2="1138" y2="178" stroke="url(#line)" stroke-width="1"/>

  <!-- Portrait frame -->
  <rect x="405" y="205" width="390" height="285" rx="10"
        fill="#050711" stroke="#8b5cff" stroke-width="2"/>
  <rect x="414" y="214" width="372" height="267" rx="7"
        fill="none" stroke="#4ffcff" stroke-opacity=".35"/>

  <!-- Existing portrait -->
  <image href="medlyn_cyberpunk_github_portrait.gif"
         x="435" y="220" width="330" height="255"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Portrait scan frame -->
  <line x1="435" y1="235" x2="765" y2="235" stroke="#4ffcff" stroke-opacity=".5"/>
  <line x1="435" y1="458" x2="765" y2="458" stroke="#ff4fc8" stroke-opacity=".35"/>

  <!-- Side data panels -->
  <g font-family="monospace">
    <text x="70" y="220" fill="#4ffcff" font-size="12" letter-spacing="2">CORE SYSTEMS</text>

    <text x="70" y="258" fill="#ffffff" font-size="13">AI SYSTEMS</text>
    <rect x="70" y="270" width="250" height="7" rx="3" fill="#20243c"/>
    <rect x="70" y="270" width="226" height="7" rx="3" fill="url(#bar)"/>

    <text x="70" y="312" fill="#ffffff" font-size="13">BACKEND / APIs</text>
    <rect x="70" y="324" width="250" height="7" rx="3" fill="#20243c"/>
    <rect x="70" y="324" width="214" height="7" rx="3" fill="url(#bar)"/>

    <text x="70" y="366" fill="#ffffff" font-size="13">AUTOMATION</text>
    <rect x="70" y="378" width="250" height="7" rx="3" fill="#20243c"/>
    <rect x="70" y="378" width="202" height="7" rx="3" fill="url(#bar)"/>

    <text x="70" y="420" fill="#ffffff" font-size="13">SYSTEMS</text>
    <rect x="70" y="432" width="250" height="7" rx="3" fill="#20243c"/>
    <rect x="70" y="432" width="190" height="7" rx="3" fill="url(#bar)"/>
  </g>

  <!-- Right side metadata -->
  <g font-family="monospace">
    <text x="845" y="220" fill="#ff4fc8" font-size="12" letter-spacing="2">CURRENT BUILD</text>

    <text x="845" y="258" fill="#aeb6d6" font-size="12">FOCUS</text>
    <text x="845" y="281" fill="#ffffff" font-size="15">INTELLIGENT SYSTEMS</text>

    <text x="845" y="320" fill="#aeb6d6" font-size="12">ENVIRONMENT</text>
    <text x="845" y="343" fill="#ffffff" font-size="15">CLOUD / AI / SOFTWARE</text>

    <text x="845" y="382" fill="#aeb6d6" font-size="12">STATE</text>
    <text x="845" y="405" fill="#4ffcff" font-size="15">BUILDING NEXT</text>

    <text x="845" y="444" fill="#aeb6d6" font-size="12">GRADUATION</text>
    <text x="845" y="467" fill="#ffffff" font-size="15">2026</text>
  </g>

  <!-- Bottom navigation rail -->
  <line x1="62" y1="520" x2="1138" y2="520" stroke="#ffffff" stroke-opacity=".12"/>

  <g font-family="monospace" font-size="13" letter-spacing="1">
    <text x="70" y="555" fill="#4ffcff">[01] ABOUT</text>
    <text x="250" y="555" fill="#ffffff">[02] WORLD</text>
    <text x="435" y="555" fill="#ffffff">[03] EXPERIENCE</text>
    <text x="665" y="555" fill="#ffffff">[04] SKILLS</text>
    <text x="830" y="555" fill="#ffffff">[05] QUEST</text>
    <text x="990" y="555" fill="#ff4fc8">[06] CONTACT</text>
  </g>

  <text x="62" y="585" fill="#68708e" font-family="monospace" font-size="10" letter-spacing="2">
    BUILD / LEARN / SHIP / REPEAT
  </text>
</svg>